name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version bump to apply when no explicit version is provided
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Optional explicit version (for example 1.2.3)
        required: false
        type: string

concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release branch
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run ci

      - name: Compute release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            npm version "$INPUT_VERSION" --no-git-tag-version
          else
            npm version "$INPUT_RELEASE_TYPE" --no-git-tag-version
          fi

          VERSION=$(node -p "require('./package.json').version")
          BRANCH="release/v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Refresh changelog
        run: npm run changelog

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release branch commit
        run: |
          git switch -c "${{ steps.version.outputs.branch }}"
          git add CHANGELOG.md package.json package-lock.json
          git commit -m "chore(release): prepare v${{ steps.version.outputs.version }}"

      - name: Push release branch
        run: git push --set-upstream origin "${{ steps.version.outputs.branch }}"

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          cat <<EOF > release-pr-body.md
          ## Summary

          - prepare release branch \`$BRANCH\`
          - bump project version to \`v$VERSION\`
          - refresh \`CHANGELOG.md\` with git-cliff

          ## Validation

          - npm run ci
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): prepare v$VERSION" \
            --body-file release-pr-body.md
