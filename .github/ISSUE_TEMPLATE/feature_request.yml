name: Feature request
description: Propose a new tool, wizard, workflow, or DX improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the tool family, wizard, skill, or repo change.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add API details, workflow notes, or roadmap alignment.
